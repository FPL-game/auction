name: Update Auction League FPL data

on:
  schedule:
    # Every 5 minutes — GitHub Actions' practical floor for scheduled workflows.
    # The script is cheap to run off-season/off-gameweek — it just refreshes the
    # player pool and no-ops on live scores. In practice GitHub deprioritizes
    # frequent schedules under load, so runs can land hours apart — the push
    # trigger below is what actually gets a feed-wording change live quickly.
    - cron: "*/5 * * * *"
  push:
    branches:
      - main
    paths:
      # Files that generate the Social Media feed's wording. A push touching
      # these regenerates the data immediately (instead of waiting on the
      # unreliable schedule above), and that commit's workflow_run then
      # triggers deploy-pages.yml so the new wording goes live on its own.
      - "scripts/update-fpl-data.mjs"
      - "src/lib/auctionLeagueUtils.mjs"
  workflow_dispatch: {}

permissions:
  contents: write

concurrency:
  group: update-fpl-data
  cancel-in-progress: false

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Sync FPL data
        env:
          # The Social Media feed's TypeSafe repetition check (in update-fpl-data.mjs
          # itself, not the separate guard below) needs this too — it fails open without
          # it, so this isn't optional the way it might look at a glance.
          TYPESAFE_API_KEY: ${{ secrets.TYPESAFE_API_KEY }}
        run: node scripts/update-fpl-data.mjs

      - name: TypeSafe sanity check (budgets & rosters)
        env:
          TYPESAFE_API_KEY: ${{ secrets.TYPESAFE_API_KEY }}
        run: node scripts/typesafe-guard.mjs

      - name: Commit and push if changed
        run: |
          if git diff --quiet -- src/data/auctionLeague.json; then
            echo "No changes to commit."
            exit 0
          fi
          git config user.name "auction-league-bot"
          git config user.email "actions@github.com"
          git add src/data/auctionLeague.json
          git commit -m "Auto-sync FPL data"
          git push
