name: Deploy to GitHub Pages

# Publishes the built site to https://fpl-game.github.io/auction/ via the
# gh-pages branch. Runs on pushes to main AND whenever the FPL data-sync
# workflow finishes — GitHub does not let a push made by the default
# Actions token (as update-fpl-data.yml's commit is) trigger other
# push-based workflows, so workflow_run is required to pick those up too.

on:
  push:
    branches:
      - main
  workflow_run:
    workflows: ["Update Auction League FPL data"]
    types: [completed]
  workflow_dispatch: {}

permissions:
  contents: write

concurrency:
  group: deploy-pages
  cancel-in-progress: true

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    if: github.event_name != 'workflow_run' || github.event.workflow_run.conclusion == 'success'
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.workflow_run.head_sha || github.ref }}

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: "npm"

      - name: Install dependencies
        run: npm ci

      - name: Build
        run: npm run build

      - name: Deploy to gh-pages branch
        uses: peaceiris/actions-gh-pages@v4
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: ./dist
          publish_branch: gh-pages
          keep_files: false
